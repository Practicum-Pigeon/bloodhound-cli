name: Publish Binaries to Release (Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos:
          - windows
        goarch:
          - amd64

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Values
        run: |
          echo "VERSION=$(git describe --tags --abbrev=0)" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u '+%d %b %Y')" >> $GITHUB_ENV

      - name: Build and Release
        uses: wangyoucao577/go-release-action@v1.53
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}

          project_path: "."
          binary_name: "bloodhound-cli"

          ldflags: >
            -s -w
            -X "github.com/SpecterOps/BloodHound_CLI/cmd/config.Version=${{ env.VERSION }}"
            -X "github.com/SpecterOps/BloodHound_CLI/cmd/config.BuildDate=${{ env.BUILD_DATE }}"

          release_tag: ${{ github.ref_name }}

          # Важно для форка:
          release_name: ${{ github.ref_name }}
          release: true

          overwrite: true

          executable_compression: upx --brute

          asset_name: bloodhound-cli-${{ matrix.goos }}-${{ matrix.goarch }}
